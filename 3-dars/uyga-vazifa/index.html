<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-dars</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
    <div class="main">
        <h2>Contact Us</h2>
        <form class="main-form">
            <div class="form1">
                <div>
                    <label class="title" for="firstname">First Name *</label>
                    <input type="text" id="firstname" required>
                </div>
                <div>
                    <label class="title" for="lastname">Last Name *</label>
                    <input type="text" id="lastname" required>
                </div>
            </div>

            <div class="form2">
                <label class="title" for="email">Email Address *</label>
                <input type="email" id="email" required>
            </div>

            <div class="form3">
                <label class="title">Query Type *</label>
                <div class="form3-radio">
                    <div class="form3-input">
                        <input type="radio" id="general-request" name="request" required>
                        <label for="general-request">General Enquiry</label>
                    </div>
                    <div class="form3-input">
                        <input type="radio" id="support-request" name="request" required>
                        <label for="support-request">Support Request</label>
                    </div>
                </div>
            </div>

            <div class="form4">
                <label class="title" for="message">Message *</label>
                <textarea id="message" required></textarea>
            </div>

            <div class="form5">
                <input type="checkbox" id="checkbox" required>
                <label class="title" for="checkbox">I consent to being contacted by the team *</label>
            </div>

            <button class="btn">
                Submit
            </button>
            

            
            
        </form>
    </div>
</body>
</html>
